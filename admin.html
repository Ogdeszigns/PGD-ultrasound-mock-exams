<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PGD Ultrasound — Admin Dashboard</title>
</head>

<body>

  <h1>PGD Ultrasound Admin Dashboard</h1>

  <div id="loginPanel">

  <h2>Admin Login</h2>

  <input
    type="email"
    id="adminEmail"
    placeholder="Admin email"
  >

  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >

  <button id="loginBtn">
    Login
  </button>

  <p id="loginMessage"></p>

</div>
  <div id="adminDashboard" style="display:none;">

  <h2>Admin Dashboard</h2>

  <p>You are logged in as administrator.</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const SUPABASE_URL =
    "https://wyxejfjmtbcdaunipxpi.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DWOMxasUNN3WJVWcIg520Q_YMrheEXy";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

  const loginBtn = document.getElementById("loginBtn");
  const loginMessage = document.getElementById("loginMessage");

  loginBtn.addEventListener("click", async function () {

    const email =
      document.getElementById("adminEmail").value.trim();

    const password =
      document.getElementById("adminPassword").value;

    loginMessage.textContent = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      console.error("Login failed:", error);
      loginMessage.textContent =
        "Login failed: " + error.message;
      return;
    }

   console.log("Admin login successful:", data.user);

loginMessage.textContent =
  "Login successful!";

document.getElementById("loginPanel").style.display = "none";
document.getElementById("adminDashboard").style.display = "block";
  });
</script>
  
</body>
</html>

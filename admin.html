<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PGD Ultrasound — Admin Dashboard</title>
</head>

<body>

  <h1>PGD Ultrasound Admin Dashboard</h1>

  <div id="loginPanel">

  <h2>Admin Login</h2>

  <input
    type="email"
    id="adminEmail"
    placeholder="Admin email"
  >

  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >

  <button id="loginBtn">
    Login
  </button>

  <p id="loginMessage"></p>

</div>
  <div id="adminDashboard" style="display:none;">

  <h2>Admin Dashboard</h2>

  <p>You are logged in as administrator.</p>

</div>
<div id="resultsPanel" style="display:none;">

  <h2>Quiz Attempts (<span id="attemptCount">0</span>)</h2>
<button id="refreshBtn">Refresh Results</button>
  <input
  type="text"
  id="searchInput"
  placeholder="Search student, ID, or exam..."
>
  
  <table border="1" cellpadding="8" cellspacing="0">
    <thead>
      <tr>
        <th>Student Name</th>
        <th>Student ID</th>
        <th>Exam Title</th>
        <th>Score</th>
        <th>Total Questions</th>
        <th>Percentage</th>
        <th>Time Taken</th>
        <th>Started At</th>
        <th>Completed At</th>
      </tr>
    </thead>

    <tbody id="resultsTableBody">
    </tbody>
  </table>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const SUPABASE_URL =
    "https://wyxejfjmtbcdaunipxpi.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DWOMxasUNN3WJVWcIg520Q_YMrheEXy";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

  const loginBtn = document.getElementById("loginBtn");
  const loginMessage = document.getElementById("loginMessage");

  loginBtn.addEventListener("click", async function () {

    const email =
      document.getElementById("adminEmail").value.trim();

    const password =
      document.getElementById("adminPassword").value;

    loginMessage.textContent = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      console.error("Login failed:", error);
      loginMessage.textContent =
        "Login failed: " + error.message;
      return;
    }

   console.log("Admin login successful:", data.user);

loginMessage.textContent =
  "Login successful!";
const resultsPanel = document.getElementById("resultsPanel");
resultsPanel.style.display = "block";
    async function loadQuizAttempts() {

  const { data, error } = await supabaseClient
    .from("quiz_attempts")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Failed to load quiz attempts:", error);
    return;
  }

  console.log("Quiz attempts loaded:", data);
      const tableBody = document.getElementById("resultsTableBody");
      const attemptCount = document.getElementById("attemptCount");
attemptCount.textContent = data.length;

tableBody.innerHTML = "";

data.forEach(function(attempt) {

  const row = document.createElement("tr");

  row.innerHTML = `
    <td>${attempt.student_name || ""}</td>
    <td>${attempt.student_id || ""}</td>
    <td>${attempt.exam_title || ""}</td>
    <td>${attempt.score || ""}</td>
    <td>${attempt.total_questions || ""}</td>
    <td>
  ${attempt.percentage || 0}%
  ${attempt.percentage >= 50 ? " — PASS" : " — FAIL"}
</td>
    <td>${attempt.time_taken_seconds ? Math.floor(attempt.time_taken_seconds / 60) + " min " + (attempt.time_taken_seconds % 60) + " sec" : ""}</td>
    <td>${attempt.started_at || ""}</td>
    <td>${attempt.completed_at || ""}</td>
  `;

  tableBody.appendChild(row);
});
}
    loadQuizAttempts();
    document.getElementById("refreshBtn").addEventListener("click", function() {
  loadQuizAttempts();
});
document.getElementById("loginPanel").style.display = "none";
document.getElementById("adminDashboard").style.display = "block";
  });
</script>
  
</body>
</html>
